<style>
:root{
  --navy:#0b2c52; --red:#ff5b51; --amber:#ffcf6b; --ice:#bcd7f2; --ink:#eaf3ff;
  --m:clamp(20px,4vw,64px);
  --gap:80px;
  /* four sizes, no more */
  --t-display:calc((min(100vw, 1568px) - 2 * var(--m)) / 12.2);
  --t-lead:1.5rem;
  --t-body:1.125rem;
  --t-small:0.875rem;
}
@media (min-width:960px){ :root{ --gap:128px; --t-lead:1.75rem; --t-display:calc((min(100vw, 1568px) - 2 * var(--m)) / 17.4); } }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:var(--t-body);line-height:1.5;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.wrap{padding-inline:var(--m);max-width:1568px;margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* wordmark */
.wm{font-weight:800;text-transform:uppercase;letter-spacing:.02em;text-decoration:none;white-space:nowrap}
.wm .sl{color:var(--red)}

/* ---------- header (fixed; white over the image, navy bar after it) ---------- */
.top{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px;padding-inline:var(--m);color:var(--ink);background:rgba(11,44,82,var(--bar,1));box-shadow:0 1px 0 rgba(188,215,242,calc(var(--bar,1)*.18));transition:background .25s,box-shadow .25s}
.top .wm{opacity:var(--bar,1);transition:opacity .25s}

/* ---------- hero: timeless, one image, the name ---------- */
.hero{position:relative;height:100svh;min-height:520px;overflow:hidden;background:var(--navy)}
.hero .img{position:absolute;inset:0;overflow:hidden}
.hero .img img{position:absolute;left:0;bottom:0;width:100%;height:112%;object-fit:cover;object-position:50% 100%;display:block}
@media (min-width:900px){.hero .img img{width:calc(max(100vw, 100svh * 1.7843) * 1.55);height:auto;aspect-ratio:1.7843;object-fit:fill}}
.hero .img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,44,82,.7) 0%,rgba(11,44,82,0) 45%),linear-gradient(to bottom,rgba(11,44,82,.9) 0,rgba(11,44,82,.72) 72px,rgba(11,44,82,0) 180px)}
.hero .foot{position:absolute;left:var(--m);right:var(--m);bottom:var(--m)}
.mark{display:block;margin:0;font-weight:800;letter-spacing:.02em;line-height:.8;white-space:nowrap;color:var(--ink);font-size:var(--fs,calc((100vw - 2 * var(--m)) * .163));margin-left:var(--lb,0px);animation:rise .9s .1s cubic-bezier(.2,.8,.2,1) both}
.mark .sl{color:var(--red);display:inline-block;animation:draw .6s .95s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12%)}to{opacity:1;transform:none}}
@keyframes draw{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.hero .lead{margin:16px 0 0;font-size:calc(var(--t-lead) * 1.35);font-weight:500;line-height:1.2;color:var(--ink);letter-spacing:-.005em}
/* hero = the red bridge (Can, 2026-09-25: "only the bridge pictures quite creative"). The bridge climbs
   bottom-left to top-right like the slash; the name takes the empty sky, top-left. ?hero=wall keeps the old one. */
.hero[data-h^=bridge] .img img{width:100%!important;height:100%!important;aspect-ratio:auto!important;object-fit:cover!important;object-position:70% 50%}
.hero[data-h=bridge-b] .img img{object-position:62% 50%}
.hero[data-h^=bridge] .img::after{background:linear-gradient(to bottom,rgba(11,44,82,.9) 0,rgba(11,44,82,.55) 72px,rgba(11,44,82,0) 180px)}
.hero[data-h^=bridge] .foot{top:calc(72px + var(--m));bottom:auto}
@media (max-width:899px){.hero[data-h^=bridge] .img img{object-position:78% 50%}}
/* bridge-b: the name keeps to the empty sky (left ~56% on desktop); on phones the bridge sits low, the name high */
@media (min-width:900px){.hero[data-h=bridge-b] .foot{right:auto;width:calc((100vw - 2 * var(--m)) * .56)}}
@media (max-width:899px){.hero[data-h=bridge-b] .img img{object-position:66% 100%;height:74%;top:auto;bottom:0}
  .hero[data-h=bridge-b] .img::after{background:linear-gradient(to bottom,var(--navy) 0,var(--navy) 27%,rgba(11,44,82,0) 42%)}
  .hero[data-h=bridge-b] .img::after{background:linear-gradient(to bottom,rgba(11,44,82,.92) 0,rgba(11,44,82,.75) 38%,rgba(11,44,82,0) 60%)}}

/* ---------- the sentence: sub-header before the work (amber) ---------- */
.built{background:var(--amber);color:var(--navy);padding-block:var(--gap) calc(var(--gap) * .6)}
.top .wm{font-size:var(--t-lead);line-height:1}
.nav{display:flex;align-items:center;gap:24px;font-size:1rem;font-weight:600}
.nav a{text-decoration:none}
.nav a:hover{text-decoration:underline;text-underline-offset:4px}
.lang{display:flex;gap:8px}
.lang a{padding:4px 0;opacity:.72}
.lang a[aria-current]{opacity:1;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.lang span{opacity:.6;color:var(--red)}
@media (max-width:379px){ .top .wm{font-size:var(--t-body)} .nav{gap:16px} }
.top .lang a{opacity:.85}

.built h2{margin:0;font-size:var(--t-display);font-weight:800;line-height:1.12;letter-spacing:-.015em}
.nw{white-space:nowrap}
.end{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0 .06em;margin:0 -.06em;cursor:pointer;white-space:nowrap;
  text-decoration:none;
  border-radius:.06em;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .2s,color .2s,text-decoration-color .2s}
.end:hover,.end:focus-visible{text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.12em}
.bd{display:none}
@media (min-width:960px){ .bd{display:inline} .bm{display:none} }
@keyframes in{from{opacity:0}to{opacity:1}}

/* ---------- studio line: a full-bleed image chapter (Can, 2026-09-25: "more impactful big images") ---------- */
.line{position:relative;margin-top:var(--gap);min-height:100svh;display:flex;align-items:flex-start;padding-top:calc(var(--m) + 48px);padding-bottom:var(--m);overflow:hidden;max-width:none}
.line .bg{position:absolute;inset:0;z-index:0}
.line .bg img{width:100%;height:100%;object-fit:cover;object-position:60% 60%;display:block}
.line .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,44,82,.85) 0,rgba(11,44,82,.35) 45%,rgba(11,44,82,0) 70%)}
.line p,.line .txt{position:relative;z-index:1;max-width:1568px;margin-inline:auto;width:100%}
.line.invite .bg img{object-position:40% 38%}
.line.invite{min-height:64svh;align-items:flex-end;padding-bottom:calc(var(--m) + 32px)}
.line.invite .bg::after{background:linear-gradient(to top,rgba(11,44,82,.9) 0,rgba(11,44,82,.5) 40%,rgba(11,44,82,0) 70%)}
.invite h2{margin:0;font-size:var(--t-display);font-weight:800;line-height:1.08;letter-spacing:-.015em}
.invite .mail{display:inline-block;margin-top:16px;font-size:var(--t-lead);font-weight:500;color:var(--ink);text-decoration:none;box-shadow:inset 0 -2px 0 var(--amber)}
.invite .mail:hover{color:var(--amber)}
@media (max-width:899px){.line .bg img{object-position:72% 100%}}
.line p{margin:0;font-size:var(--t-display);font-weight:800;line-height:1.08;letter-spacing:-.015em}
.line em{font-style:normal;color:var(--amber);white-space:nowrap}

/* ---------- contact: over the bridge at night (40-2), the page closes where it opened ---------- */
.contact{position:relative;margin-top:0;padding-top:64px;padding-bottom:var(--gap);max-width:none;overflow:hidden}
.contact h2{margin:0;font-size:var(--t-lead);font-weight:800;line-height:1.2}
.contact h2 a{display:inline-block;margin-top:8px;color:var(--amber);font-weight:600;text-underline-offset:6px}
form{display:grid;gap:24px}
label{display:grid;gap:8px;font-size:var(--t-small);font-weight:600;color:var(--ice)}
input,textarea{font:inherit;font-size:var(--t-body);color:var(--ink);background:transparent;border:2px solid rgba(188,215,242,.55);border-radius:8px;padding:8px 16px;min-height:48px;width:100%}
textarea{min-height:144px;resize:vertical}
input:focus,textarea:focus{border-color:var(--amber);outline:none}
button[type=submit]{justify-self:start;font:inherit;font-size:var(--t-body);font-weight:800;color:var(--navy);background:var(--amber);border:0;border-radius:8px;padding:8px 32px;min-height:48px;cursor:pointer}
button[type=submit]:hover{background:var(--ink)}
@media (min-width:960px){
  form{grid-template-columns:1fr 1fr}
  .full{grid-column:1/-1}
}

footer{padding-block:var(--gap) 32px}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:var(--t-small);color:var(--ice)}
.foot a{text-underline-offset:4px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ================= E: the same page, pushed (Can, 2026-09-25: "more radical, but along these lines") =================
   1. scale: every statement fitted to its line; 2. the slash as structure: every section starts on a diagonal
   cut at the slash's angle; 3. the work full-bleed, the project names at display size. */
:root{ --cut:clamp(56px, 9vw, 150px); }
/* the hero: the mark goes edge to edge at the foot, over the bridge */
.hero[data-h^=bridge] .foot{top:auto!important;bottom:calc(var(--cut) + var(--m));width:auto!important;right:var(--m)!important}
.hero[data-h^=bridge] .img::after{background:linear-gradient(to top,rgba(11,44,82,.92) 0,rgba(11,44,82,.55) 34%,rgba(11,44,82,0) 60%),linear-gradient(to bottom,rgba(11,44,82,.85) 0,rgba(11,44,82,0) 160px)!important}
.hero .lead{font-size:calc(var(--t-lead) * 1.5)}
@media (max-width:899px){.hero .lead{font-size:clamp(16px,5.4vw,24px);white-space:nowrap;font-weight:500}}
@media (max-width:899px){.hero[data-h=bridge-b] .img img{height:100%!important}}
/* slabs: each section starts on the slash's diagonal, rising left to right */
.slab{position:relative;margin-top:calc(-1 * var(--cut));--sx:62%;clip-path:polygon(0 var(--cut),var(--sx) var(--cut),calc(var(--sx) + var(--cut) * .249) 0,100% 0,100% 100%,0 100%);padding-top:calc(var(--cut) + 48px)!important}
.line.slab{z-index:2}.built.slab{z-index:3}.line.invite.slab{z-index:5}.contact.slab{z-index:6;background:var(--navy)}
/* statements fitted to their line */
.fit{display:block;width:max-content;max-width:none;white-space:nowrap;font-size:var(--fs,10vw);line-height:.98;letter-spacing:-.02em}
.line p,.invite h2{font-size:inherit}
.line em.fit{color:var(--amber)}
.line.invite{min-height:78svh}
/* the sentence, larger */
@media (min-width:960px){.built h2{font-size:calc(var(--t-display) * 1.28);line-height:1.06}}
.built.slab{padding-bottom:calc(var(--cut) + 32px)!important}
/* desktop: every name on one line */
@media (min-width:960px){.stage .tn{white-space:nowrap;font-size:clamp(20px,1.9vw,30px)}}
.contact form{width:100%;max-width:720px}
@media (min-width:960px){.contact form{grid-template-columns:1fr 1fr}}
.w{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:88px 0 32px;border-top:1px solid rgba(188,215,242,.14)}
.w:first-of-type{border-top:0;padding-top:24px}
.fitw{display:block;width:max-content;white-space:nowrap;font-size:var(--fs,10vw);font-weight:800;line-height:.95;letter-spacing:-.02em;color:var(--ink)}
@keyframes read{from{transform:translateY(0)}to{transform:translateY(calc(-100% + var(--h)))}}

/* ---------- motion layers (Higgsfield / Seedance, Refik Anadol-style), poster = the still ---------- */
.bg .vid{width:100%;height:100%;object-fit:cover;display:block}
/* ---------- contact: one screen, the line + email + form over the moving pigment ---------- */
.line.invite{min-height:100svh!important;align-items:flex-end}
.line.invite .bg::after{background:linear-gradient(to top,rgba(8,24,48,.94) 0,rgba(8,24,48,.72) 45%,rgba(8,24,48,.25) 80%)!important}
.invite .txt{display:grid;gap:32px}
.cgrid{display:grid;gap:32px}
.reach p{margin:0 0 8px;font-size:var(--t-body);color:var(--ice)}
.reach .mail{margin-top:0!important}
.invite form{display:grid;gap:18px;max-width:560px}
.invite label{display:grid;gap:6px;font-size:.8125rem;font-weight:600;color:var(--ice)}
.invite input,.invite textarea{font:inherit;font-size:1rem;color:var(--ink);background:rgba(8,24,48,.45);border:0;border-bottom:1.5px solid rgba(234,243,255,.45);border-radius:0;padding:10px 4px;min-height:44px;width:100%}
.invite textarea{min-height:88px;resize:vertical}
.invite input:focus,.invite textarea:focus{outline:none;border-color:var(--amber)}
.invite button[type=submit]{justify-self:start;font:inherit;font-weight:700;color:var(--navy);background:var(--amber);border:0;padding:12px 32px;min-height:48px;cursor:pointer}
.invite button[type=submit]:hover{background:var(--ink)}
@media (min-width:960px){.cgrid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:end;gap:48px}.invite form{grid-template-columns:1fr 1fr;max-width:none}.invite .full{grid-column:1/-1}}
@media (max-width:959px){.line.invite{padding-top:calc(var(--cut) + 96px)!important}}

/* contact on desktop: the ribbons run across the top of the section, the words sit below them on calm navy */
@media (min-width:960px){
  .line.invite .bg{bottom:auto;height:62%}
  .line.invite .bg::after{background:linear-gradient(to bottom,rgba(8,24,48,.2) 0,rgba(8,24,48,0) 30%,rgba(8,24,48,0) 60%,rgba(8,24,48,1) 100%)!important}
  .line.invite{background:#0a1a33}
}

/* ---------- the work, structured: each chapter pins for one screen while its site scrolls with the page
   (Can: "when I go down and up I see these example sites stop scrolling at random places") ---------- */
.w{height:175svh;min-height:0!important;display:block!important;padding:0!important}
@media (prefers-reduced-motion:reduce){.w{height:auto}}

/* ---------- the hero sequence (Can: "luxembourg bridge dissolves into small dots ... real objects turn into 3d refik anadol style dots"):
   the hero pins while you scroll; the bridge dissolves into points in step with the scroll; then the studio's line appears ---------- */
.hseq{position:relative;height:260svh}
.hseq .hero{position:sticky;top:0}
.hero .foot{opacity:var(--fo,1);transition:opacity .15s linear}
.hstance{position:absolute;z-index:3;left:var(--m);right:var(--m);bottom:calc(var(--cut) + var(--m) + 24px);opacity:var(--so,0);transform:translateY(calc((1 - var(--so,0)) * 32px))}
.hstance p{margin:0}
.hstance .fit{font-weight:800;color:var(--ink);line-height:.98;letter-spacing:-.02em}
.hstance em.fit{font-style:normal;color:var(--amber)}

/* the dust becomes the line (Can: "as we scrolled down, the particles would go down and make up the text") */
.hero .dust{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;opacity:0}

/* frame sequence (smooth scrubbing) */
.hero .seq-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block}
@media (max-width:899px){.hero .seq-poster{object-position:50% 50%}}
.hero .seq-poster{opacity:var(--vo,1)}
.invite .legal{display:flex;gap:24px;margin:clamp(40px,8svh,80px) 0 0;font-size:14px;color:var(--ice);opacity:.75}
.invite .legal a{color:inherit}
.invite .reach{align-self:start}
.contact.invite,.invite.slab{padding-bottom:28px!important}
/* option 1: the sentence is the portfolio */
.k1-grid{display:grid;gap:28px}
.k1 .end{text-decoration:underline;text-decoration-thickness:max(1px,.025em);text-underline-offset:.12em;text-decoration-color:rgba(11,44,82,.45);transition:text-decoration-color .3s}
.k1 .end[aria-pressed="true"]{text-decoration-thickness:.08em;text-decoration-color:var(--navy)}
.k1-view{margin:0;--bleed:calc(var(--m) + max(0px, (100vw - 1568px) / 2))}
.k1-shot{margin-right:calc(-1 * var(--bleed))}
.k1{overflow:clip}
.k1-shot{position:relative;display:block;aspect-ratio:390/360;overflow:hidden;background:#fff;box-shadow:0 18px 40px -18px rgba(11,44,82,.45)}
.k1-img{position:absolute;inset:0;opacity:0;transition:opacity .35s ease}
.k1-img.on{opacity:1}
.k1-img img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:object-position 6s ease}
.k1-shot:hover .k1-img.on img{object-position:center 60%}
.k1-view figcaption{display:grid;gap:4px;margin-top:16px}
.k1-n{font-size:var(--t-lead);font-weight:800;line-height:1.15}
.k1-l{font-size:1rem;line-height:1.45}
.k1-d{font-size:1rem;font-weight:600;color:var(--navy)}
@media (min-width:960px){
  .k1-grid{grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:56px;align-items:center}
  .k1 .bm{display:inline}.k1 .bd{display:none}
  .k1 h2{font-size:min(3.5vw,54px,6.8svh)!important;line-height:1.1!important}
  .k1-shot{aspect-ratio:1200/860}
}
.hstance .fit{font-size:var(--fs,calc((100vw - 2 * var(--m)) * .0842))}
.hstance em.fit{font-size:var(--fs,calc((100vw - 2 * var(--m)) * .167))}
#contact .fit{font-size:var(--fs,calc((min(100vw, 1568px) - 2 * var(--m)) * .122))}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}
.fstat{grid-column:1/-1;margin:0;min-height:1.5em;font-size:1rem;color:var(--ice)}
.glf{position:fixed;inset:0;width:100%;height:100%;z-index:8;pointer-events:none;mix-blend-mode:screen}
.bg .vid2{width:100%;height:100%;object-fit:cover;display:block;opacity:var(--cv,1)}
.line.invite .bg{background:rgb(12,19,42)}   /* the video's own dark, so the section stays dark while the video is hidden */
.hstance{pointer-events:none}   /* the line sits over the hero until it forms; clicks go to the arrow under it */
.cue{position:fixed;z-index:9;right:var(--m);bottom:var(--m);transition:background-color .2s,border-color .2s,color .2s,opacity .35s,visibility .35s}
.cue.gone{opacity:0;visibility:hidden}
.cue.on-amber{border-color:rgba(11,44,82,.6);color:var(--navy);background:rgba(255,207,107,.5)}
.cue.on-amber:hover,.cue.on-amber:focus-visible{background:var(--navy);color:var(--amber);border-color:var(--navy)}
.cue{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;border:1.5px solid rgba(234,243,255,.55);background:rgba(11,44,82,.35);color:var(--ink);cursor:pointer;transition:background-color .2s,border-color .2s}
.cue:hover,.cue:focus-visible{background:var(--ink);color:var(--navy);border-color:var(--ink)}
.cue svg{animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}

(() => {

    document.documentElement.lang = l;
    els.forEach(el => { el.textContent = (D[l] && D[l][el.dataset.t]) || el.dataset.en; });
    links.forEach(a => a.toggleAttribute('aria-current', a.lang === l));
    try { localStorage.setItem('webwerk_lang', l); } catch (e) {}

})();

<script>
(() => {

precision highp float;

float hash(float n){ return fract(sin(n) * 43758.5453123); }

float noise(vec3 p){

vec3 curl(vec3 p){

      // plain sines, so the living ribbons stay cheap; u_live eases in so the motion starts from the formed shape

      float rc = 1.0 - pow(1.0 - lin, 3.0);                     // falls in quickly, settles softly

      }

      // living: darker so the headline and form read on top, and the grains swell with the wave (fuller on the
      // crests), so the ribbons read as cloth rather than dust (Can: "more darker ... dots get a little bigger")
      float crest = 0.5 + 0.5 * sin(ph);

  }
  function fitLines() {
    document.querySelectorAll('.fit').forEach(el => {
      const box = el.parentElement.getBoundingClientRect().width;
      el.style.setProperty('--fs', '100px');
      const w = el.getBoundingClientRect().width;
      el.style.setProperty('--fs', (100 * box / w * 0.995).toFixed(2) + 'px');
    });
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); fitLines(); });
  addEventListener('resize', fitLines);
  addEventListener('resize', fit);
})();
</script>
<script>
(() => {
  const S = [["The Ember Review", "An open research journal, with submissions and a searchable archive.", "emberreview.org", "emberreview"], ["Ember Scholars", "The site for a research mentorship programme.", "emberscholars.com", "emberscholars"], ["Books Worth Reading", "A catalogue of 1,285 books by 620 TED speakers, each paired with the talk.", "books-worth-reading.com", "bwr"], ["Lounbrëck", "Payroll compliance software for employers with cross-border staff.", "lounbreck.com", "lounbreck"], ["Lux Lucis Consulting", "An advisory firm's site with its research series.", "luxlucisconsulting.com", "luxlucis"]];
  const ends = [...document.querySelectorAll('.end')], imgs = [...document.querySelectorAll('.k1-img')];
  const shot = document.querySelector('.k1-shot'), n = document.querySelector('.k1-n'), l = document.querySelector('.k1-l'), d = document.querySelector('.k1-d');
  let cur = -1;
  function pick(i, force) {
    if (i === cur && !force) return; cur = i;
    ends.forEach((e, k) => e.setAttribute('aria-pressed', k === i));
    imgs.forEach((e, k) => e.classList.toggle('on', k === i));
    const [name, en, dom] = S[i], line = wwT('cap' + i, en);
    shot.href = d.href = 'https://' + dom; shot.setAttribute('aria-label', 'Open ' + name);
    n.textContent = name; l.textContent = line; d.innerHTML = dom + '&nbsp;↗';
  }
  const fine = matchMedia('(hover:hover) and (pointer:fine)');
  ends.forEach((e, i) => {
    e.addEventListener('click', () => pick(i));
    e.addEventListener('focus', () => pick(i));
    e.addEventListener('mouseenter', () => { if (fine.matches) pick(i); });
  });
  pick(0);
  addEventListener('ww:lang', () => pick(cur, true));
  // until someone hovers, taps or tabs, the preview walks through the five on its own while in view
  const reduceM = matchMedia('(prefers-reduced-motion: reduce)');
  let timer = 0, touched = false;
  const stop = () => { touched = true; clearInterval(timer); timer = 0; };
  ends.forEach(e => ['pointerdown', 'focus'].forEach(t => e.addEventListener(t, stop)));
  ends.forEach(e => e.addEventListener('mouseenter', () => { if (fine.matches) stop(); }));
  shot.addEventListener('pointerdown', stop);
  if (!reduceM.matches && 'IntersectionObserver' in window) new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting && !touched) { if (!timer) timer = setInterval(() => pick((cur + 1) % S.length), 3200); }
    else { clearInterval(timer); timer = 0; }
  }), { threshold: .5 }).observe(document.querySelector('.k1'));
})();

// contact form: send to Formspree in the page; if that fails, open a prefilled email so nothing is lost
(() => {
  const f = document.getElementById('contactForm'); if (!f) return;
  const btn = f.querySelector('button[type=submit]'), stat = f.querySelector('.fstat'); let label = btn.textContent;
  addEventListener('ww:lang', () => { if (!btn.disabled) label = btn.textContent; });
  const mailto = d => {
    const name = (d.get('name') || '').toString().trim();
    const body = 'Name: ' + name + '\nEmail: ' + (d.get('email') || '') + '\nBusiness: ' + (d.get('business') || '') + '\n\n' + (d.get('message') || '') + '\n';
    return 'mailto:jean@webwerk.lu?subject=' + encodeURIComponent('Webwerk: ' + (name || 'new enquiry')) + '&body=' + encodeURIComponent(body);
  };
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (!f.reportValidity()) return;
    const d = new FormData(f);
    btn.disabled = true; btn.textContent = wwT('f_sending', 'Sending…'); stat.textContent = '';
    try {
      const r = await fetch(f.action, { method: 'POST', headers: { Accept: 'application/json' }, body: d });
      if (!r.ok) throw new Error('status ' + r.status);
      f.reset(); btn.textContent = wwT('f_sent', 'Sent ✓'); stat.textContent = wwT('f_thanks', 'Thank you. Your message is with us.');
      setTimeout(() => { btn.disabled = false; btn.textContent = label; }, 6000);
    } catch (err) {
      btn.disabled = false; btn.textContent = label;
      stat.textContent = wwT('f_failed', 'That did not go through, so your email app is opening with the message filled in.');
      location.href = mailto(d);
    }
  });
})();
</script>
