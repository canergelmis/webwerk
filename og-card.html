<!DOCTYPE html>
<!-- Source of og.png (the link-preview card, 1200x630). Render: serve the repo root and screenshot this page
     at 1200x630 (studio/tools/og.mjs does it). Same design as the home page: the red bridge, WEB/WERK, the line. -->
<html><head><meta charset="UTF-8" />
<meta name="robots" content="noindex,nofollow" />
<link rel="stylesheet" href="/fonts/archivo-var.css" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#0b2c52;color:#eaf3ff;font-family:Archivo,sans-serif;position:relative}
  .img{position:absolute;inset:0;background:url(/assets/hero/bridge.jpg) 70% 40%/cover no-repeat}
  .img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,44,82,.94) 0,rgba(11,44,82,.82) 42%,rgba(11,44,82,.2) 78%,rgba(11,44,82,.05) 100%)}
  .pad{position:relative;height:100%;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .mark{font-weight:800;font-size:44px;letter-spacing:.02em;line-height:1}
  .x{color:#ff5b51}
  h1{font-weight:800;font-size:76px;line-height:1.02;letter-spacing:-.02em}
  h1 em{display:block;font-style:normal;color:#ffcf6b;font-size:112px;line-height:.98}
  .sub{margin-top:26px;font-size:26px;font-weight:500;color:#bcd7f2}
</style></head>
<body>
  <div class="img"></div>
  <div class="pad">
    <div class="mark">WEB<span class="x">/</span>WERK</div>
    <div>
      <h1>The web looks the same.<em>Yours won't.</em></h1>
      <p class="sub">Design studio, Luxembourg · webwerk.lu</p>
    </div>
  </div>
</body></html>
