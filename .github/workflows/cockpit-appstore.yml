name: Cockpit App Store snapshot

# Daily App Store chart positions and rating counts for the private cockpit page under x/.
# Commits only that page's data file; GitHub Pages then republishes the site.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cockpit-appstore
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python openai-european-expansion-strategy/scripts/fetch_appstore.py
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add openai-european-expansion-strategy/data/appstore_history.json
          git diff --cached --quiet || git commit -m "Cockpit: App Store snapshot $(date -u +%F)"
          git pull --rebase --quiet
          git push
