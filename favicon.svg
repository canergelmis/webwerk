<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="5" fill="#0b2c52"/>
  <!-- browser window -->
  <rect x="5.5" y="7" width="21" height="18" rx="2" fill="none" stroke="#bcd7f2" stroke-width="1.6"/>
  <!-- address bar divider -->
  <line x1="5.5" y1="12.6" x2="26.5" y2="12.6" stroke="#bcd7f2" stroke-width="1.5"/>
  <!-- window controls (make it unmistakably a browser, not a card) -->
  <circle cx="8.7" cy="9.8" r="1.05" fill="#ff5b51"/>
  <circle cx="12" cy="9.8" r="1.05" fill="#ffcf6b"/>
  <circle cx="15.3" cy="9.8" r="1.05" fill="#bcd7f2"/>
  <!-- rendered page: image block + text lines -->
  <rect x="9" y="16.2" width="8" height="5.6" rx="1" fill="#ff5b51"/>
  <line x1="19.4" y1="17" x2="23.5" y2="17" stroke="#ffcf6b" stroke-width="1.5"/>
  <line x1="19.4" y1="20" x2="22.2" y2="20" stroke="#ffcf6b" stroke-width="1.5"/>
</svg>
